services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: stp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: stp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stp -d stp"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      target: build
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://stp:${POSTGRES_PASSWORD}@db:5432/stp?schema=public
    command:
      - sh
      - -ec
      - |
        if [ -d prisma/migrations ] && [ "$(ls -A prisma/migrations | wc -l)" -gt 0 ]; then
          npx prisma migrate deploy
        else
          echo 'No migrations found, preparing the existing schema before prisma db push'
          npx prisma db execute --file prisma/thinklink-upgrade.sql --schema prisma/schema.prisma
          npx prisma db push
        fi

  thinklink-sync:
    build:
      context: .
      target: build
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://stp:${POSTGRES_PASSWORD}@db:5432/stp?schema=public
    command: ["./node_modules/.bin/tsx", "scripts/sync-thinklink.ts", "--watch"]

  seed:
    profiles: ["tools"]
    build:
      context: .
      target: build
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://stp:${POSTGRES_PASSWORD}@db:5432/stp?schema=public
      NODE_ENV: development
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin123}
      SEED_MANAGER_PASSWORD: ${SEED_MANAGER_PASSWORD:-manager123}
    command: ["sh","-c","npx prisma db push && npx prisma db seed"]

  web:
    build: .
    image: stp-service:prod
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      DATABASE_URL: postgresql://stp:${POSTGRES_PASSWORD}@db:5432/stp?schema=public
      ADMIN_API_KEY: ${ADMIN_API_KEY}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env.production
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: stp
      POSTGRES_USER: stp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "0 3 * * *"
      BACKUP_DIR: /backups
      POSTGRES_EXTRA_OPTS: "-Z9"
    volumes:
      - pgbackups:/backups

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["prod"]
    depends_on:
      web:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env.production
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  pgbackups:
  caddy_data:
  caddy_config:

